# محیط توسعه‌ی محلی PartMachine — PostgreSQL + Redis
#
#   docker compose up -d db redis
#
# پورت‌ها عمداً غیرپیش‌فرض‌اند (5433/6380) تا با سرویس‌های دیگر روی همین ماشین
# تداخل نداشته باشند؛ با متغیرهای PM_DB_PORT و PM_REDIS_PORT قابل تغییرند.
# این فایل فقط برای توسعه است؛ رمزها و تنظیمات تولید جداگانه تعریف می‌شوند.

name: partmachine

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: partmachine
      POSTGRES_PASSWORD: partmachine
      POSTGRES_DB: partmachine
    ports:
      - "127.0.0.1:${PM_DB_PORT:-5433}:5432"
    volumes:
      - pm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partmachine -d partmachine"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PM_REDIS_PORT:-6380}:6379"
    volumes:
      - pm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pm_db_data:
  pm_redis_data:
