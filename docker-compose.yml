# محیط توسعه‌ی محلی PartMachine — PostgreSQL + Redis (و S3 فقط برای آزمون)
#
#   docker compose up -d db redis
#
# پورت‌ها عمداً غیرپیش‌فرض‌اند (5433/6380) تا با سرویس‌های دیگر روی همین ماشین
# تداخل نداشته باشند؛ با متغیرهای PM_DB_PORT و PM_REDIS_PORT قابل تغییرند.
# این فایل فقط برای توسعه است؛ رمزها و تنظیمات تولید جداگانه تعریف می‌شوند.

name: partmachine

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: partmachine
      POSTGRES_PASSWORD: partmachine
      POSTGRES_DB: partmachine
    ports:
      - "127.0.0.1:${PM_DB_PORT:-5433}:5432"
    volumes:
      - pm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partmachine -d partmachine"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PM_REDIS_PORT:-6380}:6379"
    volumes:
      - pm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # فضای فایل S3-سازگار، فقط برای آزمون فایل‌ها روی S3 (TEST_STORAGE_BACKEND=s3):
  #   docker compose up -d s3
  # versitygw رایگان و متن‌باز است (ایمیج‌های رایگان MinIO دیگر منتشر نمی‌شوند)؛ کد برنامه همان
  # پروتکل استاندارد S3 را به کار می‌برد و به این سرور وابسته نیست.
  s3:
    image: versity/versitygw:v1.9.0
    profiles: ["s3"]
    environment:
      ROOT_ACCESS_KEY_ID: partmachine
      ROOT_SECRET_ACCESS_KEY: partmachine-dev-secret
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_HEALTH: /health
    ports:
      - "127.0.0.1:${PM_S3_PORT:-7070}:7070"
    volumes:
      - pm_s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pm_db_data:
  pm_redis_data:
  pm_s3_data:
