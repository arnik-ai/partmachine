<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#212d48" />
    <title>اتصال برقرار نیست | تراشینو</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #212d48;
        color: #f4f6fb;
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
        line-height: 1.9;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #c7cee0;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 10px;
        padding: 10px 24px;
        background: #b98918;
        color: #fff;
        cursor: pointer;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        تراشینو بدون اینترنت کار نمی‌کند و اطلاعات شما فقط روی سرور نگه داشته می‌شود. پس از
        برقراری اتصال، دوباره تلاش کنید.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
