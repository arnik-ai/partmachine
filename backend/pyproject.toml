[project]
name = "partmachine-backend"
version = "0.2.0"
description = "PartMachine — industrial B2B marketplace API"
requires-python = ">=3.12"
# نسخه‌ها دقیق pin شده‌اند تا build تکرارپذیر باشد؛ ارتقا آگاهانه و با اجرای تست‌ها انجام شود.
dependencies = [
    "fastapi==0.137.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "redis==8.1.0",
    "tzdata==2026.5",
    # فضای فایل S3-سازگار (گام 4c)؛ botocore هم pin شده چون رفتار client در آن است
    "boto3==1.43.114",
    "botocore==1.43.114",
    # وابستگی گذرای FastAPI/httpx؛ صریحاً pin شده تا advisoryهای GHSA-82r6/3w57/5p39 (رفع در 4.14.2) برنگردند
    "anyio==4.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "C4"]
# متن‌های فارسی طولانی‌اند؛ طول خط را formatter مدیریت می‌کند.
# B008: Depends(...) در امضای تابع الگوی استاندارد FastAPI است.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# پوشه‌ی alembic/ (اسکریپت‌های migration) نباید پکیج alembic را «داخلی» جلوه دهد
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["alembic/versions/"]
