# کنترل کیفیت هر push و pull request: بک‌اند روی PostgreSQL 17 و Redis واقعی (فایل‌ها یک بار روی دیسک
# و یک بار روی سرور S3)، و فرانت با هر دو build.
name: CI

on:
  push:
    branches: [master, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: partmachine
          POSTGRES_PASSWORD: partmachine
          POSTGRES_DB: partmachine
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U partmachine -d partmachine"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # سرور S3 رایگان برای اجرای دوم تست‌ها (همان تنظیم docker-compose.yml)
      s3:
        image: versity/versitygw:v1.9.0
        env:
          ROOT_ACCESS_KEY_ID: partmachine
          ROOT_SECRET_ACCESS_KEY: partmachine-dev-secret
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_HEALTH: /health
        ports: ["7070:7070"]
        volumes:
          - pm_s3_data:/data
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:7070/health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://partmachine:partmachine@localhost:5433/partmachine
      REDIS_URL: redis://localhost:6380/0
      TEST_DATABASE_URL: postgresql+asyncpg://partmachine:partmachine@localhost:5433/partmachine_test
      TEST_REDIS_URL: redis://localhost:6380/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app
      - name: Runtime dependencies have no known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Migrations round-trip on a clean database
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests (PostgreSQL + Redis)
        run: pytest -q
      - name: Tests again with files on S3 (versitygw)
        env:
          TEST_STORAGE_BACKEND: s3
        run: pytest -q
      - name: OpenAPI contract is committed and up to date
        run: |
          python -m app.export_openapi
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the backend contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Server build (demo mode off)
        run: npm run build
      - name: Server build refuses demo mode
        run: |
          if NEXT_PUBLIC_DEMO_MODE=true npx next build; then
            echo "The server build must fail when NEXT_PUBLIC_DEMO_MODE=true" >&2
            exit 1
          fi
      - name: Demo build (GitHub Pages)
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /partmachine
      - name: Runtime dependencies have no high/critical advisories
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # چرخه‌ی کامل در مرورگر واقعی: API و فرانت تولیدی روی PostgreSQL و Redis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: partmachine
          POSTGRES_PASSWORD: partmachine
          POSTGRES_DB: partmachine
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U partmachine -d partmachine"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # ادمین آزمون فقط در پایگاه موقت همین job ساخته می‌شود (رمز واقعی نیست)
      E2E_ADMIN_EMAIL: admin-e2e@example.com
      E2E_ADMIN_PASSWORD: e2e-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Migrate, create the test admin and start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          printf '%s' "$E2E_ADMIN_PASSWORD" | python -m app.create_admin --email "$E2E_ADMIN_EMAIL" --name "ادمین آزمون" --password-stdin
          # آزمون مرورگر در هر اجرا ده‌ها حساب تازه می‌سازد؛ محدودیت نرخ فقط برای همین API آزمایشی
          # خاموش است (تست‌های بک‌اند خود محدودیت را می‌آزمایند و تولید اجازه‌ی خاموش کردنش را نمی‌دهد)
          # ادمین آزمون هم بدون ورود دومرحله‌ای (آزمون جدای two-factor همان مسیر را با حساب عادی می‌آزماید)
          RATE_LIMIT_ENABLED=false ADMIN_TWO_FACTOR_REQUIRED=false nohup uvicorn app.main:app --port 8100 > "$RUNNER_TEMP/api.log" 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cd .next/standalone
          PORT=3100 HOSTNAME=127.0.0.1 nohup node server.js > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:8100/ready && curl -fs -o /dev/null http://127.0.0.1:3100/; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install the browser
        working-directory: frontend
        # chromium برای همه‌ی آزمون‌ها؛ webkit (موتور Safari) برای آزمون نمایش روی آیفون و آیپد
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100
      - name: Keep the report and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log


  production-stack:
    # ایمیج‌های تولیدی و راه‌اندازی یک‌دستوری (فاز ۴، گام 4b): ساخت، بالا آمدن پشت Caddy با تنظیمات
    # production، و آزمون دود از بیرون. رمزها همین‌جا تصادفی ساخته می‌شوند و جایی ذخیره نمی‌شوند.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod.ci -p pmci
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway production settings
        run: |
          {
            echo "APP_DOMAIN=localhost"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "BACKUP_PASSWORD=$(openssl rand -hex 24)"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "PUBLIC_PORT_SUFFIX=:8443"
          } > deploy/.env.prod.ci
      - name: Build and start everything with one command
        run: $COMPOSE up -d --build
      - name: Wait until the API and worker are healthy and Caddy answers
        run: |
          for i in $(seq 1 60); do
            if [ "$($COMPOSE ps api --format '{{.Health}}')" = "healthy" ] \
              && [ "$($COMPOSE ps worker --format '{{.Health}}')" = "healthy" ] \
              && curl -fsk -o /dev/null https://localhost:8443/; then exit 0; fi
            sleep 3
          done
          $COMPOSE ps -a
          exit 1
      - name: Smoke test from outside
        run: |
          test "$($COMPOSE ps -a migrate --format '{{.ExitCode}}')" = "0"
          curl -fsk https://localhost:8443/ | grep -q 'rel="manifest"'
          # CSP با nonce از پشت Caddy هم می‌رسد (گام 4e)
          curl -fskI https://localhost:8443/ | grep -i '^content-security-policy:' | grep "'nonce-" | grep -q upgrade-insecure-requests
          curl -fsk https://localhost:8443/manifest.webmanifest | grep -q '"display":"standalone"'
          curl -fsk https://localhost:8443/api/v1/agreements/buyer_signup | grep -q '"key":"buyer_signup"'
          # مستندات API و سلامت داخلی از بیرون در دسترس نیستند؛ نام سرور هم لو نمی‌رود
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/v1/docs)" = "404"
          if curl -skI https://localhost:8443/ | grep -qi '^server:'; then echo "Server header leaked"; exit 1; fi
          # هر کار worker را یک بار با تنظیمات production اجرا کن
          # پایش (گام 4e): وضعیت عمومی از بیرون هست؛ آمار فقط داخل سرور
          curl -fsk https://localhost:8443/api/v1/status | grep -q '"ok"'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/metrics)" = "404"
          $COMPOSE exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/metrics').read().decode())" | grep -q partmachine_http_requests_total
          for job in delivery_reminders expired_uploads old_notifications outbox site_watch; do
            $COMPOSE exec -T worker python -m app.worker --run "$job"
          done
      - name: Backup and restore drill (timed)
        run: |
          # یک حساب واقعی، پشتیبان، پاک کردن کامل پایگاه داده، بازگردانی، و بررسی دوباره
          printf '%s' 'drill-Passw0rd-long' | $COMPOSE exec -T api \
            python -m app.create_admin --email drill@example.com --name "تمرین بازگردانی" --password-stdin
          count() { $COMPOSE exec -T db psql -U partmachine -d partmachine -tAc "$1"; }
          test "$(count "select count(*) from users where email = 'drill@example.com'")" = "1"
          start=$(date +%s)
          $COMPOSE exec -T backup partmachine-backup run
          echo "::notice title=Backup drill::backup took $(( $(date +%s) - start ))s"
          $COMPOSE exec -T backup partmachine-backup list
          $COMPOSE stop api worker
          $COMPOSE exec -T db psql -U partmachine -d postgres \
            -c 'DROP DATABASE partmachine WITH (FORCE)' -c 'CREATE DATABASE partmachine'
          test "$(count "select count(*) from pg_tables where schemaname = 'public'")" = "0"
          start=$(date +%s)
          $COMPOSE exec -T backup partmachine-backup restore --yes
          echo "::notice title=Restore drill::restore took $(( $(date +%s) - start ))s"
          $COMPOSE start api worker
          for i in $(seq 1 40); do
            [ "$($COMPOSE ps api --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          test "$(count "select count(*) from users where email = 'drill@example.com'")" = "1"
          curl -fsk https://localhost:8443/api/v1/status | grep -q '"ok"'
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
