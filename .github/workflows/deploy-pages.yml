name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# کمترین دسترسی: مرحله‌ی build (که کد و وابستگی‌های npm را اجرا می‌کند) فقط خواندن دارد؛ نوشتن در Pages و
# توکن OIDC فقط برای مرحله‌ی deploy است
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # نسخه‌ی GitHub Pages فقط دموی برچسب‌دار است (D9): داده‌ی نمونه، بدون سرور و بدون ثبت اطلاعات
      - run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /partmachine
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
